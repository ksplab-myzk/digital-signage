<html>
<body style="background:black; color:white; font-family:sans-serif;">

<h1 style="text-align:center; margin-top:40px; font-size:48px;">
Playlist Check Result
</h1>

{% if errors %}
    <h2 style="color:red; text-align:center;">エラーが見つかりました</h2>

    <ul style="font-size:24px;">
    {% for title, msgs in errors %}
        <li style="margin-bottom:20px;">
            <strong>{{ title }}</strong>
            <ul>
                {% for m in msgs %}
                    <li style="color:#ff6666;">{{ m }}</li>
                {% endfor %}
            </ul>
        </li>
    {% endfor %}
    </ul>

{% else %}
    <h2 style="color:lightgreen; text-align:center;">すべて正常です</h2>
{% endif %}

</body>
</html>
